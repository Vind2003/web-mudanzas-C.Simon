# Comprobaciones automáticas en cada cambio subido a GitHub y en cada pull request.
# Si alguna falla, GitHub lo marca en rojo y avisa por correo.
name: Calidad

on:
  push:
  pull_request:

jobs:
  comprobaciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar la web
        run: npm run build

      - name: Validar el HTML
        run: npx html-validate "_site/**/*.html"

      - name: Accesibilidad (pa11y con axe)
        run: |
          # Usa el Chrome que ya trae la máquina de GitHub; si no lo hubiera, pa11y descarga uno.
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            export CHROME_PATH="$CHROME" PUPPETEER_SKIP_DOWNLOAD=true
          fi
          # Sirve la web generada con las mismas cabeceras que Vercel (puerto 8090)
          npm run preview &
          npx --yes wait-on --timeout 60000 http://localhost:8090
          npx --yes pa11y-ci@5 --config .pa11yci.js

      - name: Lighthouse (rendimiento, accesibilidad, buenas prácticas y SEO)
        run: npx --yes @lhci/cli@0.14.x autorun
